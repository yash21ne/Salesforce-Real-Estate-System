<template>
    <lightning-card title="Property Location" icon-name="utility:checkin">
        <div class="slds-p-around_medium">
            <template if:true={isLoaded}>
                <!-- Standard lightning-map automatically geocodes the address -->
                <lightning-map
                    map-markers={mapMarkers}
                    zoom-level={zoomLevel}>
                </lightning-map>
            </template>
            <template if:false={isLoaded}>
                <lightning-spinner alternative-text="Loading Map..." size="small"></lightning-spinner>
            </template>
        </div>
    </lightning-card>
</template>
